"Time/Date, e.g. 2025-10-12T22:00:00Z"
scalar DateTime

"@deprecated Unknown."
scalar Unknown

scalar UUID

"A 36 digit UUID; can be blank in special cases"
scalar ID

"e.g. courses.course.fb6004ca-803d-4121-8451-ea809e3f23ef or courses.appointment.uuid"
scalar ResourceName

scalar Cursor

enum CheckInAttemptStatus {
    Success,
    Failure,
}

type CursorPageInfo {
    end_cursor: Cursor
    has_next_page: Boolean
}
type PostingEntry {
    cursor: Cursor
    posting: Posting
}

type PaginatedPostings {
    total_count:  Int
    page_info: CursorPageInfo
    postings: PostingEntry
}

type User {
    id: ID!

    first_name: String!
    last_name: String!

    email: String

    postings(filters: [Filter!]): [Posting!]
    paginatedPostings(filters: [Filter!], sorters: [SortBy!], pagination: CursorPagination): PaginatedPostings

    messages(filters: [Filter], sorters: [Sorter], pagination: MessagePagination, search: String): Unknown
    documents: Unknown
    waitingList: Unknown

    calendars: Calendar

    courses(isTutor: Boolean, isEnrolled: Boolean): [Course!]
}

# There is a special "unknown" user with all fields set to null and id is a blank string or a zero uuid
type CourseUser {
    id: ID!

    first_name: String!
    last_name: String!

    email: String
    contactable: Boolean
}

type EnrolledUser {
    id: ID!

    first_name: String!
    last_name: String!

    email: String

    payment_completed: Boolean
}

type PublicUser {
    id: ID!

    first_name: String!
    last_name: String!
}

type SectionItem {
    key: Unknown
    value: Unknown
    type: Unknown
}

type Product {
    id: ID!

    needs_approval: Boolean!

    price_options: Unknown

    with_cancellation_fee: Boolean!
    name_translatable: NameTranslatable

    parent: Product

    resource: Resource!
}

type Posting {
    id: ID!

    product: Product!


    approved_at: DateTime

    paymentIntent: Unknown # (payment_method->base_refund_fee)

    payment_completed: DateTime
    payment_pending: DateTime
    selected_duration: Unknown
    auto_renew_end_date: DateTime
    pause_info: Unknown # status, window, ...
}

union Resource = Fee | Course | Room | Location | BookingSlotResource | Appointment | Equipment # TODO: Coupon, Pass

type Equipment {
    id: ID!

    name_translatable: NameTranslatable
    condition: Unknown
}

type Fee {
    id: ID!
    name: String!
    description: String
    poster: String

    name_translatable: NameTranslatable
}

type Interval {
    id: ID!
    type: String # TODO: OFFLINE
    startTime: DateTime
    endTime: Unknown
    weekdays: [Int!]

    firstDate: Unknown
    lastDate: Unknown

    onlineSettings: Unknown # platformUrl, roomId, password
    facility: Facility
}

type Course {
    id: ID!
    name: String!
    description: String

    customID: String
    isSingleAppointmentBooking: Unknown
    created_at: DateTime

    bookingConfiguration: Unknown # capacity

    responsibleUsers: [CourseUser]

    tags: [Unknown] # Type: Tag (id, ?)

    offer: Offer!
    event: Event! # TODO !

    tutors: [CourseUser!]
    appointments: [Appointment!]

    intervals: [Interval!] # TODO

    enrolled: [EnrolledUser!]

    dependencies: [Unknown] # type, resource

    poster: String
}

type BookingSlotResource {
    id: ID!
    start: DateTime
    end: DateTime
}

type Offer {
    id: ID!
    name: String!
    slug: Unknown
    group: CourseGroup!
    poster: Unknown
}

type Event {
    id: ID!
    name: String!

    owner: Unknown

    start: DateTime!
    end: DateTime!

    current: Boolean!

    location: String
}

type CheckInAttempt {
    id: ID!
    status: CheckInAttemptStatus!
    user: CourseUser # This might be the "invalid" user too; its actually a CourseUser and not an EnrolledUser...

    message: String
}

type Appointment {
    id: ID!

    start: DateTime! # TODO !
    end: DateTime! # TODO !

    checkInStart: DateTime! # TODO !
    checkInEnd: DateTime! # TODO !


    canceledAt: DateTime

    tutors: [CourseUser!]

    location: Facility

    course: Course

    onlineSettings: OnlineSettings

    checkInAttempts: [CheckInAttempt!]
    attendees: [CourseUser!]

    visibilityBefore: Unknown
    booking_configuration: Unknown # TODO (capacity, waitingListType, startedAt, endsAt)
}

union Facility = Area | Location | Room

type GeoPoint { # TODO: typename
    id: ID!
    latitude: Float
    longitude: Float
}

type Area {
    id: ID!
    name: String!
    description: String
    geopoints: [GeoPoint]
}

type Location {
    id: ID!
    name: String!
    description: String
    geoPoint: GeoPoint
}

type Room {
    id: ID!
    name: String!
    description: String   # TODO !
    floor: Floor  # TODO !
}

type Floor {
    id: ID!
    name: String!
    building: Building # TODO !
}

type Building {
    id: ID!
    name: String!
    geoPoint: GeoPoint
}

type CourseGroup {
    id: ID!
    title: Unknown
    slug: Unknown
    semester_calendar: Calendar

    agentRoles: [String!] # "Agent"
    courseAgentRoles: [Unknown] # id, name
}

type Calendar {
    id: ID!
    color: Unknown
    events: [Event!]
}

input Filter {
    field: String!
    in: [String!]
    eq: String
    greater: String
    isNull: Boolean
}

input SortBy {
    field: String # TODO: enum?
    order: String # Desc
}

input CursorPagination {
    page_site: Int!
}

type ProductInfo { # TODO: Typename
    already_booked: Boolean!
    already_in_cart: Boolean!
    availability: Int!
    on_waiting_list: Boolean!
    product_name: String!
}

type RecurringInformation { # TODO: Typename
    billing_interval: Unknown
    auto_renew: Unknown
}

type NameTranslatable { # TODO: Typename
    key: Unknown
    value: Unknown
}

type ProductOffer { # TODO: Typename
    poster: Unknown
    description: Unknown
}

type CartProducts { # TODO: Typename
    id: ID!
    name: String
    duration: Unknown
    recurring_information: RecurringInformation
    resource: Resource!

    price: Unknown
    name_translatable: NameTranslatable
    product_offer: ProductOffer
}

type Cart { # TODO: Typename
    id: ID!
    total: Unknown
    reserved_until: DateTime!
    seconds_until_reservation_ends: Int!
    checkout_started_at: DateTime! # TODO
    created_at: DateTime!
    products: [CartProducts!]
}

type Payer {
    ID: ID!
    first_name: String
    last_name: String

    iban: String
    # TODO
}

input MessagePagination {
    page_size: Int!
    cursor: Unknown
}

input Sorter {
    field: String
    order: String # Desc
}

type PostingForTutor {
    id: ID!
    approved_at: DateTime
    product_prerequisites: [SectionItem]
    public_user: PublicUser
    additional_fields: [SectionItem]
    payment_completed: Boolean # TODO
}

input AppointmentPagination {
    page_size: Int!
}

type AppointmentsPageEntry {
    cursor: Cursor
    resource: Appointment
}

type AppointmentsPageInfo {
    end_cursor: Cursor
    has_next_page: Boolean
}

type PaginatedAppointments {
    total_count: Int
    page_entries:AppointmentsPageEntry
    page_info: AppointmentsPageInfo
}

input DeleteFreePostingInput {
    posting_id: UUID!
}

type OnlineSettings {
    platformUrl: String
    roomId: String
    password: String
}

type Query {
    user_pk(userID: ID!): User
    offers_pk(id: ID!): Offer

    get_unread_messages: Int!
    get_unread_threads: Int!
    booking_in_progress: Boolean!

    Product_infos(filters: Filter): ProductInfo # TODO: Filter array
    cat: Cart

    get_payer: Payer

    list_transactions: Unknown

    appointments_pk(id: ID!): Appointment
    appointments(filters: [Filter]): [Appointment!]
    appointments_for_tutor(orders: [SortBy], pagination: AppointmentPagination, filters: [Filter]): PaginatedAppointments
    course_groups: [CourseGroup!] # TODO

    courses: [Course!] # not used, mostly times out

    courses_pk(id: ID!): Course

    get_course_single_appointments(course_id: UUID!, filters: [Filter]): Appointment # TODO: Type
    public_product_form_data(resource_name: ResourceName!): Unknown # (additional_fields, product_id, product_prerequisites)

    postings_for_tutor(resource_name: ResourceName!): [PostingForTutor!]
    certificate_pk(id: UUID!): Unknown # Certificate
}

type Mutation {
    appointment_checkin(actualAppointmentID: ID!, userID: ID!, expectedAppointmentID: ID!): CheckInAttempt
    delete_checkin_attempt(checkinAttemptID: ID!): CheckInAttempt
    delete_free_posting(input: DeleteFreePostingInput): Boolean
    cancel_and_refund_posting(id: UUID!): Boolean
}
